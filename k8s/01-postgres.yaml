apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: music-shop
type: Opaque
stringData:
  POSTGRES_DB: musicshop
  POSTGRES_USER: musicshop
  POSTGRES_PASSWORD: musicshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: music-shop
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: music-store
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: music-store
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-credentials } }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "musicshop"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: music-shop
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ port: 5432 }]
