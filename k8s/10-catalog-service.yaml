apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: music-shop
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: music-store
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: catalog-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: music-store
    spec:
      containers:
        - name: catalog-service
          image: musicshop/catalog-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/musicshop
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: music-shop
spec:
  selector: { app.kubernetes.io/name: catalog-service }
  ports: [{ port: 8081 }]
