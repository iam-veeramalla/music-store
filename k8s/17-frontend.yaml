apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: music-shop
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: music-store
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: music-store
    spec:
      containers:
        - name: frontend
          image: musicshop/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: API_GATEWAY_URL
              value: http://api-gateway:3000
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: music-shop
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ port: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  namespace: music-shop
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - port: 8080
      nodePort: 30080
