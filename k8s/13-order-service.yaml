apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: music-shop
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: music-store
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: order-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: music-store
    spec:
      containers:
        - name: order-service
          image: musicshop/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8084 }]
          env:
            - name: DATABASE_URL
              value: postgresql://musicshop:musicshop@postgres:5432/musicshop
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8085
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8082
            - name: SHIPPING_SERVICE_URL
              value: http://shipping-service:8086
          readinessProbe:
            httpGet: { path: /healthz, port: 8084 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: music-shop
spec:
  selector: { app.kubernetes.io/name: order-service }
  ports: [{ port: 8084 }]
