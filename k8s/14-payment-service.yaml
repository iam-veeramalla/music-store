apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: music-shop
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: music-store
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: payment-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: music-store
    spec:
      containers:
        - name: payment-service
          image: musicshop/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8085 }]

          readinessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: music-shop
spec:
  selector: { app.kubernetes.io/name: payment-service }
  ports: [{ port: 8085 }]
