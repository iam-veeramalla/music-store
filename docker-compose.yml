services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: musicshop
      POSTGRES_USER: musicshop
      POSTGRES_PASSWORD: musicshop
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  catalog-service:
    build: ./services/catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/musicshop
      SPRING_DATASOURCE_USERNAME: musicshop
      SPRING_DATASOURCE_PASSWORD: musicshop
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  inventory-service:
    build: ./services/inventory-service
    ports: ["8082:8082"]

  cart-service:
    build: ./services/cart-service
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["8083:8083"]
    depends_on: [redis]

  order-service:
    build: ./services/order-service
    environment:
      DATABASE_URL: postgresql://musicshop:musicshop@postgres:5432/musicshop
      PAYMENT_SERVICE_URL: http://payment-service:8085
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      SHIPPING_SERVICE_URL: http://shipping-service:8086
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }

  payment-service:
    build: ./services/payment-service
    ports: ["8085:8085"]

  shipping-service:
    build: ./services/shipping-service
    ports: ["8086:8086"]

  api-gateway:
    build: ./services/api-gateway
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      SHIPPING_SERVICE_URL: http://shipping-service:8086
    ports: ["3000:3000"]
    depends_on: [catalog-service, inventory-service, cart-service, order-service, payment-service, shipping-service]

  frontend:
    build: ./services/frontend
    environment:
      API_GATEWAY_URL: http://api-gateway:3000
    ports: ["8080:8080"]
    depends_on: [api-gateway]

  load-generator:
    build: ./services/load-generator
    environment:
      API_GATEWAY_URL: http://api-gateway:3000
      INTERVAL_MS: "3000"
    depends_on: [api-gateway]
